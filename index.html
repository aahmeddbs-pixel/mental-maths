<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mental Maths Challenge</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef6ff; --card:#ffffff; --ink:#1d2a44; --muted:#6b7a99;
  --blue:#3d7bff; --green:#22b573; --red:#ff5a5f; --amber:#ffb020; --purple:#8a5cff;
  --shadow:0 10px 30px rgba(29,42,68,.12);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Baloo 2',system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;
  background-image:radial-gradient(circle at 10% 10%,#dbeaff 0,transparent 40%),radial-gradient(circle at 90% 90%,#ffe9d6 0,transparent 40%);}
.wrap{max-width:640px;margin:0 auto;padding:16px}
.card{background:var(--card);border-radius:24px;box-shadow:var(--shadow);padding:24px}
h1{font-size:2.2rem;text-align:center;line-height:1.1}
h1 span{color:var(--blue)}
.sub{text-align:center;color:var(--muted);margin:6px 0 18px}
.hidden{display:none!important}
label.title{display:block;font-weight:700;margin:16px 0 8px}
input[type=text]{width:100%;font:inherit;font-size:1.2rem;padding:10px 14px;border:3px solid #d5e2f7;border-radius:14px;outline:none}
input[type=text]:focus{border-color:var(--blue)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;font-size:1.05rem;font-weight:700;padding:8px 14px;border-radius:999px;border:3px solid #d5e2f7;background:#fff;color:var(--ink);cursor:pointer}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
.btn{font:inherit;font-weight:800;font-size:1.35rem;border:none;border-radius:18px;padding:14px 22px;cursor:pointer;color:#fff;background:var(--green);box-shadow:0 6px 0 #178a56;width:100%;margin-top:22px}
.btn:active{transform:translateY(3px);box-shadow:0 3px 0 #178a56}
.btn.alt{background:var(--blue);box-shadow:0 6px 0 #2a5bc4}
.btn.ghost{background:#fff;color:var(--ink);border:3px solid #d5e2f7;box-shadow:none}
.best{text-align:center;color:var(--muted);margin-top:12px}
/* Game */
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.pill{background:#fff;border-radius:999px;padding:6px 14px;font-weight:700;box-shadow:var(--shadow);font-size:1rem}
.pill b{color:var(--blue)}
.timer{position:relative;height:22px;background:#e3ecfb;border-radius:999px;overflow:hidden;margin:6px 0 4px}
.timer i{position:absolute;left:0;top:0;bottom:0;width:100%;background:var(--green);border-radius:999px;transition:width .1s linear,background .3s}
.secs{text-align:center;font-weight:800;font-size:1.3rem;color:var(--muted)}
.secs.low{color:var(--red);animation:pulse .5s infinite alternate}
@keyframes pulse{to{transform:scale(1.15)}}
.q{font-size:clamp(3rem,14vw,5rem);font-weight:800;text-align:center;margin:10px 0 6px;letter-spacing:2px}
.tag{text-align:center;font-weight:700;font-size:.95rem;color:#fff;display:inline-block;padding:2px 12px;border-radius:999px}
.tagwrap{text-align:center}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.opt{font:inherit;font-weight:800;font-size:2rem;padding:16px 8px;border-radius:20px;border:none;cursor:pointer;color:#fff;position:relative}
.opt small{position:absolute;top:6px;left:12px;font-size:.8rem;opacity:.7}
.opt:nth-child(1){background:#3d7bff;box-shadow:0 6px 0 #2a5bc4}
.opt:nth-child(2){background:#8a5cff;box-shadow:0 6px 0 #6339c9}
.opt:nth-child(3){background:#ff8a3d;box-shadow:0 6px 0 #cc6522}
.opt:nth-child(4){background:#13b8a6;box-shadow:0 6px 0 #0c8a7c}
.opt:active{transform:translateY(3px)}
.opt.right{background:var(--green)!important;box-shadow:0 6px 0 #178a56!important}
.opt.wrong{background:var(--red)!important;box-shadow:0 6px 0 #c23a3e!important}
.opt.dim{opacity:.35}
.typebox{display:flex;gap:10px;margin-top:14px}
.typebox input{flex:1;font:inherit;font-weight:800;font-size:2rem;text-align:center;padding:10px;border:3px solid #d5e2f7;border-radius:18px;outline:none}
.typebox input:focus{border-color:var(--blue)}
.typebox button{font:inherit;font-weight:800;font-size:1.3rem;border:none;border-radius:18px;padding:0 20px;background:var(--green);color:#fff;cursor:pointer}
.feedback{text-align:center;font-size:1.5rem;font-weight:800;min-height:2.4rem;margin-top:12px}
.feedback.good{color:var(--green)} .feedback.bad{color:var(--red)}
.row{display:flex;gap:10px} .row .btn{margin-top:14px;font-size:1.05rem;padding:10px}
/* Results */
.big{font-size:4rem;font-weight:800;text-align:center;color:var(--blue);line-height:1}
.stars{text-align:center;font-size:2.4rem;margin:6px 0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.stat{background:#f3f7ff;border-radius:16px;padding:10px;text-align:center}
.stat b{display:block;font-size:1.6rem}
.stat span{font-size:.85rem;color:var(--muted)}
.review{margin-top:16px;max-height:260px;overflow:auto;border-radius:14px;background:#fff7f7;padding:10px 14px}
.review div{padding:4px 0;border-bottom:1px dashed #f2c9ca;font-size:1.1rem}
.review div:last-child{border:none}
.confetti{position:fixed;top:-10px;width:10px;height:14px;z-index:9;animation:fall linear forwards;pointer-events:none}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.foot{text-align:center;color:var(--muted);font-size:.85rem;margin-top:14px}
</style>
</head>
<body>
<div class="wrap">

<!-- START SCREEN -->
<div id="start" class="card">
  <h1>Mental Maths <span>Challenge</span></h1>
  <p class="sub">Answer each question before the timer runs out!</p>

  <label class="title">Your name</label>
  <input type="text" id="name" placeholder="Type your name" maxlength="20">

  <label class="title">What do you want to practise?</label>
  <div class="chips" data-group="mode">
    <button class="chip on" data-v="mix">Mix ➕✖️</button>
    <button class="chip" data-v="add">Adding ➕</button>
    <button class="chip" data-v="mul">Times ✖️</button>
  </div>

  <label class="title">Multiplication level</label>
  <div class="chips" data-group="mlevel">
    <button class="chip on" data-v="tables">Times tables (to 12×12)</button>
    <button class="chip" data-v="big">2-digit × 1-digit</button>
    <button class="chip" data-v="hard">2-digit × 2-digit</button>
  </div>

  <label class="title">How many questions?</label>
  <div class="chips" data-group="count">
    <button class="chip" data-v="10">10</button>
    <button class="chip on" data-v="20">20</button>
    <button class="chip" data-v="50">50</button>
    <button class="chip" data-v="100">100</button>
    <button class="chip" data-v="250">250</button>
    <button class="chip" data-v="500">500</button>
    <button class="chip" data-v="1000">1000</button>
  </div>

  <label class="title">How do you answer?</label>
  <div class="chips" data-group="input">
    <button class="chip on" data-v="choice">Pick an option</button>
    <button class="chip" data-v="type">Type the answer</button>
  </div>

  <label class="title">Time per question</label>
  <div class="chips" data-group="time">
    <button class="chip" data-v="10">10 s</button>
    <button class="chip on" data-v="15">15 s</button>
    <button class="chip" data-v="20">20 s</button>
  </div>

  <label class="title">Sound</label>
  <div class="chips" data-group="sound">
    <button class="chip on" data-v="on">On 🔊</button>
    <button class="chip" data-v="off">Off 🔇</button>
  </div>

  <button class="btn" id="go">Start! 🚀</button>
  <p class="best" id="bestLine"></p>
</div>

<!-- GAME SCREEN -->
<div id="game" class="hidden">
  <div class="top">
    <div class="pill">Question <b id="qNum">1</b> / <span id="qTot">20</span></div>
    <div class="pill">✅ <b id="score">0</b></div>
    <div class="pill">🔥 <b id="streak">0</b></div>
  </div>
  <div class="card">
    <div class="timer"><i id="bar"></i></div>
    <div class="secs" id="secs">15</div>
    <div class="tagwrap"><span class="tag" id="tag">Adding</span></div>
    <div class="q" id="question">12 + 34</div>
    <div class="opts" id="opts"></div>
    <div class="typebox hidden" id="typebox">
      <input id="typed" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off" placeholder="?">
      <button id="submitTyped">OK</button>
    </div>
    <div class="feedback" id="fb"></div>
  </div>
  <div class="row">
    <button class="btn ghost" id="pauseBtn">⏸ Pause</button>
    <button class="btn ghost" id="quitBtn">🏁 Finish now</button>
  </div>
</div>

<!-- RESULTS SCREEN -->
<div id="results" class="card hidden">
  <h1 id="resTitle">Well done!</h1>
  <div class="stars" id="stars"></div>
  <div class="big" id="pct">0%</div>
  <p class="sub" id="resSub"></p>
  <div class="stats">
    <div class="stat"><b id="sRight">0</b><span>Correct</span></div>
    <div class="stat"><b id="sWrong">0</b><span>Wrong</span></div>
    <div class="stat"><b id="sTime">0</b><span>Too slow ⏰</span></div>
    <div class="stat"><b id="sStreak">0</b><span>Best streak</span></div>
    <div class="stat"><b id="sAvg">0s</b><span>Avg time</span></div>
    <div class="stat"><b id="sSplit">–</b><span>➕ / ✖️ right</span></div>
  </div>
  <div id="reviewWrap">
    <label class="title">Let's practise these again 💪</label>
    <div class="review" id="review"></div>
  </div>
  <button class="btn" id="retryMistakes">Practise my mistakes</button>
  <button class="btn alt" id="again">Play again</button>
  <button class="btn ghost" id="home">Change settings</button>
</div>

<p class="foot">Keyboard: press 1–4 to choose • Enter to submit • Space to pause</p>
</div>

<script>
(function(){
  "use strict";
  // ---------- Settings ----------
  const settings = {mode:"mix", mlevel:"tables", count:20, input:"choice", time:15, sound:"on"};
  document.querySelectorAll(".chips").forEach(group=>{
    group.addEventListener("click", e=>{
      const b = e.target.closest(".chip"); if(!b) return;
      group.querySelectorAll(".chip").forEach(c=>c.classList.remove("on"));
      b.classList.add("on");
      const key = group.dataset.group, v = b.dataset.v;
      settings[key] = (key==="count"||key==="time") ? parseInt(v,10) : v;
    });
  });

  function store(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
  function load(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
  const $ = id => document.getElementById(id);
  const savedName = load("mm_name"); if(savedName) $("name").value = savedName;
  function showBest(){
    const b = load("mm_best");
    $("bestLine").textContent = b ? "⭐ Best score so far: " + b : "";
  }
  showBest();

  // ---------- Sound ----------
  let actx = null;
  function beep(freq, dur, type){
    if(settings.sound!=="on") return;
    try{
      actx = actx || new (window.AudioContext||window.webkitAudioContext)();
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = type||"sine"; o.frequency.value = freq;
      g.gain.setValueAtTime(.15, actx.currentTime);
      g.gain.exponentialRampToValueAtTime(.001, actx.currentTime+dur);
      o.connect(g); g.connect(actx.destination); o.start(); o.stop(actx.currentTime+dur);
    }catch(e){}
  }
  const sRight = ()=>{ beep(660,.12); setTimeout(()=>beep(880,.15),110); };
  const sWrong = ()=>beep(200,.3,"square");
  const sTick  = ()=>beep(1000,.05);

  // ---------- Question generation ----------
  const rnd = (a,b)=>Math.floor(Math.random()*(b-a+1))+a;
  function makeAdd(){
    // Mostly 2-digit + 2-digit, some 2-digit + 1-digit for warm-up variety
    const a = rnd(10,99);
    const b = Math.random()<0.8 ? rnd(10,99) : rnd(1,9);
    return Math.random()<.5 ? {a,b,op:"+"} : {a:b,b:a,op:"+"};
  }
  function makeMul(){
    let a,b;
    if(settings.mlevel==="tables"){ a=rnd(2,12); b=rnd(2,12); }
    else if(settings.mlevel==="big"){ a=rnd(10,99); b=rnd(2,9); }
    else { a=rnd(10,99); b=rnd(10,99); }
    return Math.random()<.5 ? {a,b,op:"×"} : {a:b,b:a,op:"×"};
  }
  // Remember the previous round's questions so a new round avoids repeating them
  let recent = new Set();
  try{ recent = new Set(JSON.parse(load("mm_recent")||"[]")); }catch(e){}
  function buildSet(n){
    const list=[], seen=new Set();
    let guard=0;
    while(list.length<n && guard<n*60){
      guard++;
      let q;
      if(settings.mode==="add") q=makeAdd();
      else if(settings.mode==="mul") q=makeMul();
      else q = (list.length%2===0) ? makeAdd() : makeMul();  // even mix
      const key=q.a+q.op+q.b;
      // allow repeats only once the unique pool is used up (e.g. 1000 times-table questions)
      if(seen.has(key) && guard<n*30) continue;
      if(recent.has(key) && guard<n*15) continue;
      seen.add(key);
      q.ans = q.op==="+" ? q.a+q.b : q.a*q.b;
      list.push(q);
    }
    recent = new Set(list.map(q=>q.a+q.op+q.b));
    store("mm_recent", JSON.stringify([...recent].slice(0,1000)));
    // shuffle so mix feels random
    for(let i=list.length-1;i>0;i--){const j=rnd(0,i);[list[i],list[j]]=[list[j],list[i]];}
    return list;
  }
  function distractors(q){
    const s=new Set([q.ans]), ans=q.ans, c=[];
    if(q.op==="+"){
      c.push(ans+1,ans-1,ans+10,ans-10,ans+2,ans-2,ans+11,ans-9);
      // swapped digits trick
      const r=parseInt(String(ans).split("").reverse().join(""),10); if(r!==ans) c.push(r);
    }else{
      c.push(ans+q.a,ans-q.a,ans+q.b,ans-q.b,ans+1,ans-1,ans+10,ans-10,(q.a+1)*q.b,q.a*(q.b-1));
    }
    const out=[];
    c.sort(()=>Math.random()-.5).forEach(v=>{ if(out.length<3 && v>0 && !s.has(v)){s.add(v);out.push(v);} });
    while(out.length<3){ const v=ans+rnd(-15,15); if(v>0&&!s.has(v)){s.add(v);out.push(v);} }
    const all=[ans,...out]; all.sort(()=>Math.random()-.5);
    return all;
  }

  // ---------- Game state ----------
  let qs=[], idx=0, score=0, streak=0, bestStreak=0, timedOut=0, wrong=0;
  let mistakes=[], times=[], addRight=0, addTot=0, mulRight=0, mulTot=0;
  let timeLeft=0, timer=null, locked=false, paused=false, qStart=0, lastTick=0;

  function show(id){ ["start","game","results"].forEach(s=>$(s).classList.toggle("hidden",s!==id)); window.scrollTo(0,0); }

  function startGame(list){
    const nm=$("name").value.trim(); if(nm) store("mm_name",nm);
    qs = list || buildSet(settings.count);
    idx=0;score=0;streak=0;bestStreak=0;timedOut=0;wrong=0;mistakes=[];times=[];
    addRight=addTot=mulRight=mulTot=0;
    $("qTot").textContent=qs.length;
    $("opts").classList.toggle("hidden",settings.input!=="choice");
    $("typebox").classList.toggle("hidden",settings.input!=="type");
    paused=false; $("pauseBtn").textContent="⏸ Pause";
    show("game"); nextQ();
  }

  function nextQ(){
    if(idx>=qs.length){ finish(); return; }
    locked=false;
    const q=qs[idx];
    $("qNum").textContent=idx+1; $("score").textContent=score; $("streak").textContent=streak;
    $("question").textContent = q.a+" "+q.op+" "+q.b;
    const tag=$("tag");
    tag.textContent = q.op==="+" ? "Adding" : "Times";
    tag.style.background = q.op==="+" ? "var(--blue)" : "var(--purple)";
    $("fb").textContent=""; $("fb").className="feedback";
    if(settings.input==="choice"){
      const box=$("opts"); box.innerHTML="";
      distractors(q).forEach((v,i)=>{
        const b=document.createElement("button");
        b.className="opt"; b.innerHTML="<small>"+(i+1)+"</small>"+v; b.dataset.v=v;
        b.onclick=()=>answer(v);
        box.appendChild(b);
      });
    }else{
      $("typed").value=""; setTimeout(()=>$("typed").focus(),30);
    }
    timeLeft=settings.time; qStart=performance.now(); lastTick=Math.ceil(timeLeft);
    drawTimer(); clearInterval(timer); timer=setInterval(tick,100);
  }

  function drawTimer(){
    const pct=Math.max(0,timeLeft/settings.time*100);
    const bar=$("bar"); bar.style.width=pct+"%";
    bar.style.background = pct>50?"var(--green)":pct>25?"var(--amber)":"var(--red)";
    const s=Math.ceil(timeLeft); $("secs").textContent=Math.max(0,s);
    $("secs").classList.toggle("low",timeLeft<=5);
  }
  function tick(){
    if(paused||locked) return;
    timeLeft-=0.1;
    const s=Math.ceil(timeLeft);
    if(s<lastTick && s<=5 && s>0) sTick();
    lastTick=s;
    drawTimer();
    if(timeLeft<=0) answer(null);
  }

  function answer(v){
    if(locked||paused) return;
    locked=true; clearInterval(timer);
    const q=qs[idx]; const used=(performance.now()-qStart)/1000;
    const isAdd=q.op==="+"; if(isAdd) addTot++; else mulTot++;
    const fb=$("fb");
    if(v!==null && Number(v)===q.ans){
      score++; streak++; bestStreak=Math.max(bestStreak,streak); times.push(used);
      if(isAdd) addRight++; else mulRight++;
      const cheers=["Great job! 🎉","Super! ⭐","Brilliant! 🌟","Correct! ✅","Amazing! 🚀","You rock! 💪"];
      fb.textContent = streak>=5 && streak%5===0 ? "🔥 "+streak+" in a row!" : cheers[rnd(0,cheers.length-1)];
      fb.className="feedback good"; sRight();
    }else{
      streak=0;
      if(v===null){ timedOut++; fb.textContent="⏰ Time's up! It was "+q.ans; }
      else { wrong++; fb.textContent="Oops! "+q.a+" "+q.op+" "+q.b+" = "+q.ans; }
      fb.className="feedback bad"; sWrong();
      mistakes.push({a:q.a,b:q.b,op:q.op,ans:q.ans,given:v});
    }
    if(settings.input==="choice"){
      document.querySelectorAll(".opt").forEach(b=>{
        const n=Number(b.dataset.v);
        if(n===q.ans) b.classList.add("right");
        else if(v!==null && n===Number(v)) b.classList.add("wrong");
        else b.classList.add("dim");
      });
    }
    $("score").textContent=score; $("streak").textContent=streak;
    const ok = v!==null && Number(v)===q.ans;
    setTimeout(()=>{ idx++; nextQ(); }, ok?700:1800);
  }

  function submitTyped(){
    const t=$("typed").value.trim();
    if(t==="") return;
    answer(parseInt(t,10));
  }
  $("submitTyped").onclick=submitTyped;
  $("typed").addEventListener("keydown",e=>{ if(e.key==="Enter"){e.preventDefault();submitTyped();} });
  $("typed").addEventListener("input",e=>{ e.target.value=e.target.value.replace(/[^0-9]/g,""); });

  function togglePause(){
    if($("game").classList.contains("hidden")) return;
    paused=!paused;
    $("pauseBtn").textContent = paused ? "▶ Resume" : "⏸ Pause";
    $("question").style.visibility = paused ? "hidden" : "visible";
    $("opts").style.visibility = paused ? "hidden" : "visible";
    if(paused){ $("fb").textContent="Paused"; $("fb").className="feedback"; }
    else if(!locked){ $("fb").textContent=""; if(settings.input==="type") $("typed").focus(); }
  }
  $("pauseBtn").onclick=togglePause;
  $("quitBtn").onclick=()=>{ clearInterval(timer); qs=qs.slice(0,idx); finish(); };

  document.addEventListener("keydown",e=>{
    if($("game").classList.contains("hidden")) return;
    if(e.key===" " && settings.input==="choice"){ e.preventDefault(); togglePause(); return; }
    if(settings.input==="choice" && /^[1-4]$/.test(e.key)){
      const b=document.querySelectorAll(".opt")[parseInt(e.key,10)-1];
      if(b) answer(Number(b.dataset.v));
    }
  });

  // ---------- Results ----------
  function finish(){
    clearInterval(timer);
    const total=qs.length||1, pct=Math.round(score/total*100);
    const nm=$("name").value.trim();
    $("pct").textContent = qs.length ? pct+"%" : "0%";
    $("resSub").textContent = score+" out of "+qs.length+" correct";
    $("resTitle").textContent = pct>=90 ? "Superstar"+(nm?", "+nm:"")+"! 🏆" : pct>=70 ? "Great work"+(nm?", "+nm:"")+"! 🌟" : pct>=50 ? "Good effort"+(nm?", "+nm:"")+"! 👍" : "Keep practising"+(nm?", "+nm:"")+"! 💪";
    $("stars").textContent = pct>=90?"⭐⭐⭐":pct>=70?"⭐⭐":pct>=40?"⭐":"🌱";
    $("sRight").textContent=score; $("sWrong").textContent=wrong; $("sTime").textContent=timedOut;
    $("sStreak").textContent=bestStreak;
    $("sAvg").textContent = times.length ? (times.reduce((a,b)=>a+b,0)/times.length).toFixed(1)+"s" : "–";
    $("sSplit").textContent = (addTot?addRight+"/"+addTot:"–")+" · "+(mulTot?mulRight+"/"+mulTot:"–");
    const rev=$("review"); rev.innerHTML="";
    mistakes.forEach(m=>{
      const d=document.createElement("div");
      d.textContent = m.a+" "+m.op+" "+m.b+" = "+m.ans + (m.given===null?"   (⏰ too slow)":"   (you said "+m.given+")");
      rev.appendChild(d);
    });
    $("reviewWrap").classList.toggle("hidden",!mistakes.length);
    $("retryMistakes").classList.toggle("hidden",!mistakes.length);
    const best=parseInt(load("mm_best")||"0",10);
    if(score>best) store("mm_best",score);
    show("results");
    if(pct>=70 && qs.length) confetti();
  }
  function confetti(){
    const colors=["#3d7bff","#22b573","#ffb020","#ff5a5f","#8a5cff"];
    for(let i=0;i<80;i++){
      const c=document.createElement("div"); c.className="confetti";
      c.style.left=Math.random()*100+"vw"; c.style.background=colors[i%5];
      c.style.animationDuration=(2+Math.random()*2)+"s"; c.style.animationDelay=Math.random()*.6+"s";
      document.body.appendChild(c); setTimeout(()=>c.remove(),5000);
    }
  }

  $("go").onclick=()=>startGame();
  $("again").onclick=()=>startGame();
  $("home").onclick=()=>{ showBest(); show("start"); };
  $("retryMistakes").onclick=()=>{
    const list=mistakes.map(m=>({a:m.a,b:m.b,op:m.op,ans:m.ans}));
    startGame(list);
  };
})();
</script>
</body>
</html>
